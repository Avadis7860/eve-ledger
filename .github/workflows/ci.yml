name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eve_ledger
          POSTGRES_USER: eve_ledger
          POSTGRES_PASSWORD: eve_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve_ledger -d eve_ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eve_ledger:eve_ledger@localhost:5432/eve_ledger
      TEST_DATABASE_URL: postgresql://eve_ledger:eve_ledger@localhost:5432/eve_ledger
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply migrations twice (idempotency check)
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Format working tree for repository artifact
        run: npm run format
      - name: Upload Prettier-formatted files
        uses: actions/upload-artifact@v4
        with:
          name: eve-ledger-prettier-format
          path: |
            README.md
            docs/security/eve-sso-native-pkce.md
            src/security/eve-sso-client.ts
            src/security/local-oauth.ts
            tests/config/env.test.ts
            tests/security/eve-sso-client.test.ts
            tests/security/local-oauth.test.ts
          retention-days: 1
      - name: Run quality gates
        run: npm run check
