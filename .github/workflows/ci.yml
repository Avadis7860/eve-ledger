name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types, tests and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eve_ledger
          POSTGRES_USER: eve_ledger
          POSTGRES_PASSWORD: eve_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve_ledger -d eve_ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eve_ledger:eve_ledger@localhost:5432/eve_ledger
      TEST_DATABASE_URL: postgresql://eve_ledger:eve_ledger@localhost:5432/eve_ledger
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository formatting
        if: github.event_name == 'pull_request'
        run: npm run format
      - name: Commit formatting changes to PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "style: format repository with Prettier"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Apply migrations twice (idempotency check)
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: Run quality gates
        run: npm run check
